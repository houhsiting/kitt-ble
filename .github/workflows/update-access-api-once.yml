name: Update VoiceBox Access API Once

on:
  push:
    paths:
      - '.github/workflows/update-access-api-once.yml'

permissions:
  contents: write

jobs:
  update-access-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace old Apps Script URL only
        shell: bash
        run: |
          OLD='https://script.google.com/macros/s/AKfycbxpWNAiRfTEM-W4od29iHQHfEAkZhG6YDvnA5ESTLRmNOeED9WUBTusLZh86q2wa41gag/exec'
          NEW='https://script.google.com/macros/s/AKfycbyOROpE7ZJ7d92c5BGgUY3fzli5siP_j79raVj7mB_WiYbx8JIOIA8ykVoPcVuEX5bx/exec'
          for f in 1-2Sea-GPS.html 3-4Sea-GPS.html; do
            grep -Fq "$OLD" "$f" || { echo "Old URL not found in $f"; exit 1; }
            sed -i "s|$OLD|$NEW|g" "$f"
          done
          git diff --check
          git diff -- 1-2Sea-GPS.html 3-4Sea-GPS.html

      - name: Commit minimal URL replacement
        shell: bash
        run: |
          if git diff --quiet -- 1-2Sea-GPS.html 3-4Sea-GPS.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1-2Sea-GPS.html 3-4Sea-GPS.html
          git commit -m 'Move Tactical Remote access validation to standalone registry'
          git push
