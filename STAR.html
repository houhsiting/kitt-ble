<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOICEBOX REMOTE CONTROLER</title>

<style>
:root{
  --bg:#000000;
  --panel:#070707;
  --panel2:#0E0E0E;
  --gold:#DAA64A;
  --gold2:#B8933A;
  --red:#FF0000;
  --dim:#666666;
  --shadow1: 0 10px 18px rgba(0,0,0,.85);
  --shadow2: 0 0 24px rgba(184,147,58,.25);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
}
body{min-width:320px}

.app{
  max-width:920px;
  margin:auto;
  padding:10px;
}

.frame{
  background:var(--panel);
  border:1.6px solid var(--gold2);
  border-radius:16px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:var(--shadow1), var(--shadow2);
  overflow:hidden;
}

.center{display:flex;justify-content:center;align-items:center;text-align:center}
.col{display:flex;flex-direction:column;justify-content:center;align-items:center}
.row{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:7px 12px;
  border-radius:999px;
  border:1.2px solid var(--gold);
  background:var(--panel2);
  color:var(--gold);
  font-weight:900;
  letter-spacing:1px;
  font-size:11px;
}
.appIcon{
  width:30px;
  height:30px;
  border-radius:8px;
  margin-right:10px;
  border:1px solid var(--gold2);
  box-shadow:0 0 10px rgba(184,147,58,.20);
  object-fit:cover;
  flex:0 0 auto;
}

.h2{
  margin:0;
  font-size:12px;
  letter-spacing:1.5px;
  color:var(--gold);
  font-weight:900;
}
.sub{
  margin-top:4px;
  font-size:10px;
  color:var(--gold2);
  letter-spacing:1px;
  font-weight:700;
}
.mini{
  margin-top:4px;
  font-size:9px;
  color:var(--dim);
  letter-spacing:.8px;
  font-weight:700;
}
.kv{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.kv .line{
  width:100%;
  max-width:900px;
  text-align:center;
  color:var(--gold2);
  font-weight:700;
  font-size:10px;
  letter-spacing:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.kv .line.dim{color:var(--dim);font-size:9px}

.btn{
  border-radius:14px;
  border:1.6px solid var(--gold2);
  background:linear-gradient(135deg,#1B1200,#0A0A0A);
  color:var(--gold);
  font-weight:900;
  letter-spacing:.7px;
  cursor:pointer;
  user-select:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:8px 8px;
  position:relative;
  transition:.12s;
}
.btn:disabled{
  border-color:#2E2E2E;
  color:var(--dim);
  cursor:default;
  filter:saturate(.7);
  box-shadow:none;
}
.btn.active{
  border:2.2px solid var(--red);
  box-shadow:
    0 0 18px rgba(255,0,0,.55),
    0 0 36px rgba(255,0,0,.28),
    0 8px 10px rgba(0,0,0,.8);
}
.btnSmall{
  width:108px;
  height:38px;
  border-radius:12px;
  padding:0 8px;
  flex-direction:row;
  gap:6px;
  letter-spacing:.8px;
  font-size:12px;
}
.icon{width:16px;height:16px;display:block;fill:currentColor;opacity:.95}
.iconSmall{width:14px;height:14px}
.label{
  line-height:1.02;
  font-size:12px;
  font-weight:900;
  color:var(--gold);
  text-align:center;
}
.label small{
  display:block;
